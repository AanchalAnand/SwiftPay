version: '3.9'

services:

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swiftpay
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  transaction-gateway:
    build: ./transaction-gateway
    container_name: transaction-gateway
    depends_on:
      - postgres
      - kafka
      - redis
    ports:
      - "8080:8080"

  ledger-service:
    build: ./ledger-service
    container_name: ledger-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8081:8081"

  analytics-worker:
    build: ./analytics_worker
    container_name: analytics-worker
    depends_on:
      - postgres
      - kafka
    ports:
      - "8082:8082"