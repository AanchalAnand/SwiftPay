server.port=8081

spring.application.name=ledger-service

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/swiftpay
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IMPORTANT
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ===============================
# JPA CONFIG
# ===============================

# ===============================
# KAFKA CONFIG

#spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ledger-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# ===============================
spring.kafka.consumer.properties.spring.json.value.default.type=com.swiftpay.ledger_service.kafka.event.PaymentInitiatedEvent
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.swiftpay.ledger_service.kafka.event
management.endpoints.web.exposure.include=health,info
